<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700" role="img" aria-label="bee-rust 管理后台 架构设计图">
  <title>BRD（Bee Rust Admin）— 架构设计</title>
  <desc>浏览器 SPA → nginx 接入层 → bee_admin 应用层（bee_router / Auth / API / datascope）→ bee_orm 执行层 → MySQL 数据层</desc>
  <style>
    .bg { fill: #ffffff; }
    .band { fill: #f7f8fa; stroke: #e5e7eb; stroke-width: 1; }
    .band-label { font: 600 12px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7280; letter-spacing: .06em; }
    .box-frontend { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
    .box-backend  { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; }
    .box-db       { fill: #fefce8; stroke: #eab308; stroke-width: 1.5; }
    .box-external { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .box-security { fill: #fff1f2; stroke: #f43f5e; stroke-width: 1.5; }
    .box-inner    { fill: #ffffff; stroke: #86efac; stroke-width: 1.2; }
    .t-name { font: 600 12.5px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
    .t-sub  { font: 10.5px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7280; }
    .t-inner{ font: 11px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #166534; }
    .t-edge { font: 10px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7280; }
    .t-title{ font: 700 16px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .t-foot { font: 10px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #9ca3af; }
    .a-default { stroke: #94a3b8; stroke-width: 1.4; fill: none; }
    .a-hot     { stroke: #22c55e; stroke-width: 2; fill: none; }
    .a-sec     { stroke: #f43f5e; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="ar-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/>
    </marker>
    <marker id="ar-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="700"/>
  <text class="t-title" x="24" y="30">BRD · 架构设计</text>
  <text class="t-sub" x="24" y="48">浏览器 SPA · nginx 接入 · bee_admin 应用层 · bee_orm 执行层 · MySQL 数据层</text>

  <!-- 箭头（先画，置于框下层） -->
  <path class="a-default" d="M490,128 L490,160" marker-end="url(#ar)"/>
  <text class="t-edge" x="500" y="148">HTTP</text>

  <path class="a-hot" d="M490,232 L490,268" marker-end="url(#ar-hot)"/>
  <text class="t-edge" x="500" y="254">/api/v1</text>

  <path class="a-hot" d="M300,420 L300,470" marker-end="url(#ar-hot)"/>
  <text class="t-edge" x="310" y="449">CRUD / QuerySet</text>

  <path class="a-hot" d="M300,528 L300,566" marker-end="url(#ar-hot)"/>
  <text class="t-edge" x="310" y="551">sqlx 预处理语句（参数绑定）</text>

  <path class="a-sec" d="M700,300 L812,300" marker-end="url(#ar-sec)"/>
  <text class="t-edge" x="712" y="292">校验 JWT</text>

  <!-- 1. 客户端层 -->
  <text class="band-label" x="24" y="86">客户端</text>
  <rect class="band" x="110" y="60" width="820" height="68" rx="8"/>
  <rect class="box-frontend" x="330" y="68" width="320" height="52" rx="6"/>
  <text class="t-name" x="490" y="90" text-anchor="middle">浏览器 · 管理后台 SPA</text>
  <text class="t-sub"  x="490" y="107" text-anchor="middle">React 18 + TypeScript + Ant Design 5（Vite 构建）</text>

  <!-- 2. 接入层 -->
  <text class="band-label" x="24" y="186">接入层</text>
  <rect class="band" x="110" y="160" width="820" height="72" rx="8"/>
  <rect class="box-external" x="270" y="168" width="440" height="56" rx="6"/>
  <text class="t-name" x="490" y="191" text-anchor="middle">nginx · :8081</text>
  <text class="t-sub"  x="490" y="208" text-anchor="middle">静态资源（admin/web/dist） + /api/ 反向代理，透传 X-Real-IP</text>

  <!-- 3. 应用层 -->
  <text class="band-label" x="24" y="296">应用层</text>
  <rect class="band" x="110" y="268" width="672" height="152" rx="8"/>
  <rect class="box-backend" x="130" y="286" width="640" height="116" rx="7"/>
  <text class="t-name" x="146" y="306">bee_admin（Rust，二进制 + systemd 托管）</text>
  <rect class="box-inner" x="146" y="318" width="146" height="34" rx="5"/>
  <text class="t-inner" x="219" y="339" text-anchor="middle">bee_router（axum）</text>
  <rect class="box-inner" x="304" y="318" width="150" height="34" rx="5"/>
  <text class="t-inner" x="379" y="339" text-anchor="middle">Auth 提取器（JWT）</text>
  <rect class="box-inner" x="466" y="318" width="288" height="34" rx="5"/>
  <text class="t-inner" x="610" y="339" text-anchor="middle">API handlers · 33 个接口 · require(权限码)</text>
  <rect class="box-inner" x="146" y="360" width="300" height="30" rx="5"/>
  <text class="t-inner" x="296" y="379" text-anchor="middle">datascope 数据权限（五档，查询条件注入）</text>
  <rect class="box-inner" x="466" y="360" width="288" height="30" rx="5"/>
  <text class="t-inner" x="610" y="379" text-anchor="middle">统一响应信封 {code, msg, data}</text>

  <!-- 4. 框架层 -->
  <text class="band-label" x="24" y="500">框架层</text>
  <rect class="band" x="110" y="470" width="820" height="70" rx="8"/>
  <rect class="box-backend" x="146" y="480" width="210" height="50" rx="6"/>
  <text class="t-name" x="251" y="501" text-anchor="middle">bee_orm 执行层</text>
  <text class="t-sub"  x="251" y="518" text-anchor="middle">连接池 / QuerySet / CRUD / M2M / syncdb</text>
  <rect class="box-backend" x="372" y="480" width="180" height="50" rx="6"/>
  <text class="t-name" x="462" y="501" text-anchor="middle">bee_config</text>
  <text class="t-sub"  x="462" y="518" text-anchor="middle">INI 配置 + 启动校验</text>
  <rect class="box-backend" x="568" y="480" width="180" height="50" rx="6"/>
  <text class="t-name" x="658" y="501" text-anchor="middle">bee_logs</text>
  <text class="t-sub"  x="658" y="518" text-anchor="middle">tracing 日志</text>

  <!-- 5. 数据层 -->
  <text class="band-label" x="24" y="590">数据层</text>
  <rect class="band" x="110" y="566" width="820" height="74" rx="8"/>
  <rect class="box-db" x="146" y="576" width="560" height="54" rx="6"/>
  <text class="t-name" x="426" y="598" text-anchor="middle">MySQL 8.4（utf8mb4）</text>
  <text class="t-sub"  x="426" y="615" text-anchor="middle">admin / role / menu / dept / login_log ＋ admin_role / role_menu / role_dept（连接表）</text>

  <!-- 安全侧栏 -->
  <rect class="box-security" x="800" y="276" width="128" height="136" rx="6"/>
  <text class="t-name" x="864" y="300" text-anchor="middle">安全边界</text>
  <text class="t-sub"  x="812" y="322">HS256 JWT</text>
  <text class="t-sub"  x="812" y="340">token_version</text>
  <text class="t-sub"  x="812" y="358">强制下线</text>
  <text class="t-sub"  x="812" y="376">弱密钥拒绝</text>
  <text class="t-sub"  x="812" y="394">启动</text>
  <text class="t-foot" x="24" y="686">© 2026 erik · https://erik.xyz</text>
</svg>
