<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 780" width="980" height="780" role="img" aria-label="Bee Rust Admin request-cycle sequence diagram">
  <title>BRA (Bee Rust Admin) — Request cycle</title>
  <desc>Browser → nginx → bee_router → Auth extractor → handler (permission + data scope) → bee_orm → MySQL → envelope</desc>
  <style>
    .bg { fill: #ffffff; }
    .head-frontend { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
    .head-external { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .head-backend  { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; }
    .head-security { fill: #fff1f2; stroke: #f43f5e; stroke-width: 1.5; }
    .head-db       { fill: #fefce8; stroke: #eab308; stroke-width: 1.5; }
    .life { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 4 4; }
    .t-head{ font: 600 11.5px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
    .t-sub { font: 9.5px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7280; }
    .t-msg { font: 10.5px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #374151; }
    .t-note{ font: 10px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #b91c1c; }
    .t-title{ font: 700 16px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .t-foot{ font: 10px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #9ca3af; }
    .msg      { stroke: #64748b; stroke-width: 1.5; fill: none; }
    .msg-hot  { stroke: #22c55e; stroke-width: 2; fill: none; }
    .msg-ret  { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
    .msg-sec  { stroke: #f43f5e; stroke-width: 1.5; fill: none; }
    .selfbox  { fill: #ffffff; stroke: #f43f5e; stroke-width: 1.3; }
    .stepno { font: 600 10px ui-monospace, Menlo, Consolas, monospace; fill: #0ea5e9; }
  </style>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="m-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/>
    </marker>
    <marker id="m-ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="m-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="780"/>
  <text class="t-title" x="24" y="30">BRA · Request cycle</text>
  <text class="t-sub" x="24" y="48" font-size="10.5">Example: admin list — GET /api/v1/admins</text>

  
  <line class="life" x1="130" y1="96" x2="130" y2="716"/>
  <line class="life" x1="258" y1="96" x2="258" y2="716"/>
  <line class="life" x1="386" y1="96" x2="386" y2="716"/>
  <line class="life" x1="514" y1="96" x2="514" y2="716"/>
  <line class="life" x1="642" y1="96" x2="642" y2="716"/>
  <line class="life" x1="770" y1="96" x2="770" y2="716"/>
  <line class="life" x1="890" y1="96" x2="890" y2="716"/>

  
  <rect class="head-frontend" x="70" y="64" width="120" height="34" rx="6"/>
  <text class="t-head" x="130" y="86" text-anchor="middle">Browser SPA</text>
  <rect class="head-external" x="198" y="64" width="120" height="34" rx="6"/>
  <text class="t-head" x="258" y="86" text-anchor="middle">nginx :8081 / :443</text>
  <rect class="head-backend" x="326" y="64" width="120" height="34" rx="6"/>
  <text class="t-head" x="386" y="86" text-anchor="middle">bee_router</text>
  <rect class="head-security" x="454" y="64" width="120" height="34" rx="6"/>
  <text class="t-head" x="514" y="86" text-anchor="middle">Auth extractor</text>
  <rect class="head-backend" x="582" y="64" width="120" height="34" rx="6"/>
  <text class="t-head" x="642" y="86" text-anchor="middle">handler</text>
  <rect class="head-backend" x="710" y="64" width="120" height="34" rx="6"/>
  <text class="t-head" x="770" y="86" text-anchor="middle">bee_orm</text>
  <rect class="head-db" x="830" y="64" width="120" height="34" rx="6"/>
  <text class="t-head" x="890" y="86" text-anchor="middle">MySQL</text>

  
  <path class="msg" d="M130,128 L258,128" marker-end="url(#m)"/>
  <text class="t-msg" x="136" y="122">① GET /api/v1/admins (Authorization: Bearer &lt;token&gt;)</text>
  
  <path class="msg" d="M258,168 L386,168" marker-end="url(#m)"/>
  <text class="t-msg" x="264" y="162">② /api/ reverse proxy, pass X-Real-IP</text>
  
  <path class="msg" d="M386,208 L514,208" marker-end="url(#m)"/>
  <text class="t-msg" x="392" y="202">③ Auth extractor reads Authorization</text>
  
  <path class="msg" d="M514,248 L770,248" marker-end="url(#m)"/>
  <text class="t-msg" x="520" y="242">④ Load admin / roles / permissions</text>
  
  <path class="msg" d="M770,288 L890,288" marker-end="url(#m)"/>
  <text class="t-msg" x="776" y="282">⑤ SELECT (bound params)</text>
  
  <path class="msg-ret" d="M890,328 L514,328" marker-end="url(#m-ret)"/>
  <text class="t-msg" x="640" y="322" text-anchor="middle">⑥ User · roles · permissions</text>
  <text class="t-note" x="522" y="344">Bad signature / stale ver / disabled → 401, stop</text>
  
  <path class="msg-sec" d="M514,384 L642,384" marker-end="url(#m-sec)"/>
  <text class="t-msg" x="520" y="378">⑦ Inject Auth</text>
  
  <path class="msg-sec" d="M642,404 L704,404 L704,432 L642,432" marker-end="url(#m-sec)"/>
  <text class="t-msg" x="712" y="414">⑧ auth.require("system:admin:list")</text>
  <text class="t-note" x="712" y="430">Missing permission → 403, no DB query</text>
  
  <path class="msg-hot" d="M642,472 L770,472" marker-end="url(#m-hot)"/>
  <text class="t-msg" x="648" y="466">⑨ QuerySet filter + data-scope condition (5 levels)</text>
  
  <path class="msg-hot" d="M770,512 L890,512" marker-end="url(#m-hot)"/>
  <text class="t-msg" x="776" y="506">⑩ Prepared SELECT … LIMIT ?</text>
  
  <path class="msg-ret" d="M890,552 L642,552" marker-end="url(#m-ret)"/>
  <text class="t-msg" x="766" y="546" text-anchor="middle">⑪ Result set</text>
  
  <path class="msg-ret" d="M642,608 L130,608" marker-end="url(#m-ret)"/>
  <text class="t-msg" x="386" y="602" text-anchor="middle">⑫ {"code":0,"msg":"ok","data":{"list":[…],"total":N}}</text>
  <text class="t-sub" x="386" y="622" text-anchor="middle">Envelope; on error code = HTTP status, data = null, stable err (+ args)</text>

  
  <rect class="selfbox" x="24" y="648" width="440" height="52" rx="6"/>
  <text class="t-sub" x="38" y="668">Auth: superadmin (is_super) bypasses; others checked against role permissions.</text>
  <text class="t-sub" x="38" y="686">IP from X-Real-IP → first X-Forwarded-For → unknown; truncated to column width in login logs.</text>
  <text class="t-foot" x="24" y="762">© 2026 erik · https://erik.xyz</text>
</svg>
