[package]
name = "bee_admin"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
# 不用默认的 "full"：它会打开 bee_router 的 security（拉 security-rust 1.x），
# 而本项目用的是 3.x 的 throttle，两者会同时进依赖图。
#
# 注意 `router` 只启用 **依赖** `bee_logs`/`bee_config`，而 `bee_rust::bee_logs`
# 这类 re-export 由**同名特性** `logs`/`config` 门控 —— 两组都得列。
bee_rust = { version = "1.2.3", path = "../crates/bee_rust", default-features = false, features = ["router", "orm", "logs", "config"] }
# 派生宏生成的代码引用 bee_orm::… 路径，必须直接依赖。
# mysql：本项目只连 MySQL（上游按后端分特性，默认一个都没开）；
# chrono：模型里大量 chrono::NaiveDateTime 字段，不开这个特性读取路径编不过。
bee_orm = { version = "1.2.3", path = "../crates/bee_orm", features = ["mysql", "chrono"] }
# multipart：头像分片上传的表单提取器（axum 0.8 默认不带，得显式开）
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
# CSV 流式导出：Body::from_stream 要一个 Stream，而 tokio 1.5x 的 mpsc::Receiver
# 不再自带 Stream 实现（tokio 的 stream 特性已移除），用 tokio-stream 的适配器
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
# JWT 签发/校验走 jwt-rust 插件（本项目的失效机制是 token_version 而非黑名单，
# 自己实现空的 TokenStorage，见 src/auth.rs）。**按版本依赖，不要用 path**：
# 本机 path 在 CI 与其他机器上不存在，会让构建直接失败。
jwt-rust = "1.0"
argon2 = { version = "0.5", features = ["std"] }
# password-hash 依赖的 rand_core 默认不带 getrandom，而 OsRng 在 #[cfg(feature = "getrandom")] 后面；
# 必须显式打开（cargo 的 feature 合并会作用到 argon2 内部那份 rand_core）
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
tracing = "0.1"
# 登录限流用它的 throttle 模块。**不走 workspace = true**：workspace 表里那条
# `security-rust = "1"` 是给 bee_router 的可选 security 特性的，1.x 没有 throttle。
security-rust = "3"
# 头像分片上传走 aetherupload-rust 的内核（分块追加落盘 / 秒传 / 完整性校验）。
# **按版本依赖，不要用 path**：本机 path 在 CI 与其他机器上不存在，会让构建直接失败。
# 不开默认以外的任何 feature（默认 = 零第三方依赖的纯内核）：`axum` feature 会从
# crates.io 拉一份 bee_router，与 workspace 的 path 版冲突，而且它给的是**公开**路由
# ——我们要的是登录后才可用的上传口，路由自己挂（见 src/api/avatar.rs）。
# lib 名与包名不同：aetherupload-rust → `aetherupload`。
aetherupload-rust = { version = "1.0.3", default-features = false }
# admin.email / phone 的落库加密（AES-256-GCM，随机 nonce）。**按版本依赖，不要用
# path**：本机 path 在 CI 与其他机器上不存在，会让构建直接失败。
# lib 名与包名不同：encryptable-rust → `encryptable`。
encryptable-rust = "1.2.1"
# 主键（雪花）+ 对外 id（hashids）。两个包在 crates.io 上都有对应版本，
# **按版本依赖，不要用 path**：本地 path 会让 CI 与其他机器直接构建失败。
# lib 名与包名不同：snowflake-id-rust → `snowflake`，hashids-rust → `hashids`。
# hashids 开 `axum` 特性（项目本来就是 axum，无额外编译）；不用 `bee` ——
# 那个特性会从 crates.io 拉一份 bee_router，与 workspace 的 path 版重复。
snowflake-id-rust = "1.1.1"
hashids-rust = { version = "1.0.10", features = ["axum"] }
# 登录图形验证码（点击 / 旋转 / 滑块，随机切）。**按版本依赖，不要用 path**：
# 本机 path 在 CI 与其他机器上不存在。
# 不开 `axum` 特性：那个特性给的是插件自带的 axum 路由，返回**裸 JSON**，
# 与本项目 `{code,msg,data}` 信封不一致（前端拦截器按信封解包）；
# 这里只用不依赖框架的核心 `Guard`（core 不挂 feature 门控），路由自己挂。
# 更不要 `bee-rust` 特性 —— 它会从 crates.io 再拉一份 bee_router，与 workspace 的 path 版打架。
poster-rust = "1.1.2"
# 接口文档站（阶段 5b）。**按版本依赖，不要用 path**：本机 path 在 CI 与其他机器上不存在。
# lib 名与包名不同：apidoc-rust → `apidoc`（注解宏生成的 `apidoc::…` 路径靠它解析）。
# `axum` 特性给的是 `apidoc::axum::apidoc_routes(cfg)`（内含 /apidoc、/apidoc/api.json 等），
# 路由由我们自己 merge（默认关闭，见 [apidoc] enabled）。
apidoc-rust = { version = "1.6.2", features = ["axum"] }
# 注解宏生成的注册项引用 `::linkme::…`（属性的 `crate = …` 未被 apidoc 宏设置），
# 所以消费方必须**直接**依赖 linkme，不能只靠 apidoc 的 re-export。
linkme = "0.3"
# URL 解码（安全扫描扫百分号编码的 payload，见 src/security_scan.rs）。用标准实现，
# 别手写 percent-decode；它本来就在依赖树里（axum → serde_urlencoded → form_urlencoded），
# 只多一行声明，不新增编译成本。
form_urlencoded = "1"

[dev-dependencies]
# 集成测试直连 MySQL 建库/清表/断言用（src 已不再依赖 sqlx —— 迁移后连裸 SQL
# 都走框架的 Db::query/execute）。
# `chrono` 特性是必须的：迁移前它是被旧 bee_orm（基于 sqlx）传递带进来的，
# 换成 mysql_async 之后这层特性合并就没了，测试里读 DATETIME 列会报
# `NaiveDateTime: sqlx::Type/Decode` 未实现。
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "tls-none", "chrono"] }
# multipart：头像分片上传的集成测试要真的发 multipart 表单（字段名与前端逐字一致）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
# 只被测试用：解内嵌的 PNG 夹具（src 里最后用 base64 的地方是已删掉的 base64 头像路径）
base64 = "0.22"
# tests/ 用的 hashids-rust 走上面 [dependencies] 那条（集成测试能直接用普通依赖，
# 和 aetherupload/serde_json 一样），不在这里再声明一份，免得两个来源打架。
