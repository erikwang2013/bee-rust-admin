[package]
name = "bee_admin"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
# 不用默认的 "full"：它会把 kv / template / session / cache / security 一并拉进来
# （依赖图白胖一圈），其中 security 打开的是 bee_router 的扫描特性 —— 我们的请求安全
# 扫描是自己接 security_rust 的（src/security_scan.rs），不需要它。
#
# 注意 `router` 只启用 **依赖** `bee_logs`/`bee_config`，而 `bee_rust::bee_logs`
# 这类 re-export 由**同名特性** `logs`/`config` 门控 —— 两组都得列。
bee_rust = { version = "1.3.0", path = "../crates/bee_rust", default-features = false, features = ["router", "orm", "logs", "config"] }
# 派生宏生成的代码引用 bee_orm::… 路径，必须直接依赖。
# mysql：本项目只连 MySQL（上游按后端分特性，默认一个都没开）；
# chrono：模型里大量 chrono::NaiveDateTime 字段，不开这个特性读取路径编不过。
bee_orm = { version = "1.3.0", path = "../crates/bee_orm", features = ["mysql", "chrono"] }
# multipart：头像分片上传的表单提取器（axum 0.8 默认不带，得显式开）
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
# CSV 流式导出：Body::from_stream 要一个 Stream，而 tokio 1.5x 的 mpsc::Receiver
# 不再自带 Stream 实现（tokio 的 stream 特性已移除），用 tokio-stream 的适配器
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
# JWT 签发/校验走 jwt-rust 插件（本项目的失效机制是 token_version 而非黑名单，
# 自己实现空的 TokenStorage，见 src/auth.rs）。**按版本依赖，不要用 path**：
# 本机 path 在 CI 与其他机器上不存在，会让构建直接失败。
jwt-rust = "1.0"
argon2 = { version = "0.5", features = ["std"] }
# password-hash 依赖的 rand_core 默认不带 getrandom，而 OsRng 在 #[cfg(feature = "getrandom")] 后面；
# 必须显式打开（cargo 的 feature 合并会作用到 argon2 内部那份 rand_core）
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
tracing = "0.1"
# 登录限流用它的 throttle 模块。**不走 workspace = true**：workspace 表里那条（现在同为 4）
# 是给 bee_router 的可选 security 特性用的（默认不启用），admin 这条是实打实要 throttle
# 模块 —— 两个用点独立，各钉各的。
security-rust = "4"
# 头像分片上传走 aetherupload-rust 的内核（分块追加落盘 / 秒传 / 完整性校验）。
# **按版本依赖，不要用 path**：本机 path 在 CI 与其他机器上不存在，会让构建直接失败。
# 不开默认以外的任何 feature（默认 = 零第三方依赖的纯内核）：`axum` feature 会从
# crates.io 拉一份 bee_router，与 workspace 的 path 版冲突，而且它给的是**公开**路由
# ——我们要的是登录后才可用的上传口，路由自己挂（见 src/api/avatar.rs）。
# lib 名与包名不同：aetherupload-rust → `aetherupload`。
aetherupload-rust = { version = "3.0.0", default-features = false }
# admin.email / phone 的落库加密（AES-256-GCM，随机 nonce）。**按版本依赖，不要用
# path**：本机 path 在 CI 与其他机器上不存在，会让构建直接失败。
# lib 名与包名不同：encryptable-rust → `encryptable`。
encryptable-rust = "1.2.1"
# 主键（雪花）+ 对外 id（hashids）。两个包在 crates.io 上都有对应版本，
# **按版本依赖，不要用 path**：本地 path 会让 CI 与其他机器直接构建失败。
# lib 名与包名不同：snowflake-id-rust → `snowflake`，hashids-rust → `hashids`。
# hashids 开 `axum` 特性（项目本来就是 axum，无额外编译）；不用 `bee` ——
# 那个特性会从 crates.io 拉一份 bee_router，与 workspace 的 path 版重复。
snowflake-id-rust = "2.0.0"
hashids-rust = { version = "2.0.0", features = ["axum"] }
# 登录图形验证码（点击 / 旋转 / 滑块，随机切）。**按版本依赖，不要用 path**：
# 本机 path 在 CI 与其他机器上不存在。
# 不开 `axum` 特性：那个特性给的是插件自带的 axum 路由，返回**裸 JSON**，
# 与本项目 `{code,msg,data}` 信封不一致（前端拦截器按信封解包）；
# 这里只用不依赖框架的核心 `Guard`（core 不挂 feature 门控），路由自己挂。
# 更不要 `bee-rust` 特性 —— 它会从 crates.io 再拉一份 bee_router，与 workspace 的 path 版打架。
poster-rust = "2.0.0"
# 接口文档站（阶段 5b）。**按版本依赖，不要用 path**：本机 path 在 CI 与其他机器上不存在。
# lib 名与包名不同：apidoc-rust → `apidoc`（注解宏生成的 `apidoc::…` 路径靠它解析）。
# `axum` 特性给的是 `apidoc::axum::apidoc_routes(cfg)`（内含 /apidoc、/apidoc/api.json 等），
# 路由由我们自己 merge（默认关闭，见 [apidoc] enabled）。
apidoc-rust = { version = "2.0.0", features = ["axum"] }
# 注解宏生成的注册项引用 `::linkme::…`（属性的 `crate = …` 未被 apidoc 宏设置），
# 所以消费方必须**直接**依赖 linkme，不能只靠 apidoc 的 re-export。
linkme = "0.3"
# URL 解码（安全扫描扫百分号编码的 payload，见 src/security_scan.rs）。用标准实现，
# 别手写 percent-decode；它本来就在依赖树里（axum → serde_urlencoded → form_urlencoded），
# 只多一行声明，不新增编译成本。
form_urlencoded = "1"
# DSN 里凭据的百分号解码（备份任务把 [db] dsn 拆给 mysqldump，见 src/backup.rs）。
# 不用 form_urlencoded：那是表单语义，会把裸 `+` 解成空格，口令会静默解错。
# 同样本来就在依赖树里（form_urlencoded → percent-encoding），零新增编译成本。
percent-encoding = "2"
# CSV 导入的解析（项 3，见 src/api/import.rs）：引号、字段内换行、跨行字段这些
# 手写 split(',') 一定错的地方交给它；导出侧仍用 api/csv.rs 那套手写渲染（那边只需转义）。
csv = "1"
# TOTP 动态验证码（项 7，见 src/totp.rs）：RFC 4226 就是 HMAC-SHA1，标准实现
# 比手写 HMAC 稳妥。**钉 0.12/0.10**：这是 brief 里已确认在依赖图里的版本
# （hmac 0.13 + sha2 0.11 那一代 API 变了，别升）；两个包都已在 Cargo.lock，
# 声明只多几行，不新增编译成本。base32 与 otpauth URL 自己写（见 src/totp.rs）。
hmac = "0.12"
sha1 = "0.10"
# 附件的 sha256 摘要（项 5，见 src/api/attach.rs）在服务端落盘后算，不信客户端报的值。
# 0.10 那份本来就在依赖图里（encryptable-rust 带进来的 0.10.9），零新增 crate。
sha2 = "0.10"
# 动态验证码的二维码：后端直接出 SVG（前端 `data:image/svg+xml,` 内联即可，
# 不必再依赖一个 base64 编码库）。**只开 svg**：默认特性会拉 image 全家桶。
# qrcode 0.14 本来就在依赖图里（poster-rust 带进来的），零新增 crate。
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# 出站 HTTP（项 6 的 webhook 投递）。**从 [dev-dependencies] 提上来的**：以前只有
# 集成测试用它发请求，现在 src 也要（`src/notify.rs`）。`multipart` 只有头像分片
# 上传的集成测试用得到，但按本仓的规矩**只声明一份**（见下面 dev-dependencies 里
# hashids 的注释）：测试能直接用普通依赖，两个来源迟早打架。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
# SMTP 发信（项 6 的测试邮件）。特性集按 brief 钉死，**不动一个**：
# - 关默认特性：默认拉 native-tls（要系统 OpenSSL），本仓其他出站连接一律 rustls；
# - `builder` 给 `Message::builder()`，`hostname` 给 EHLO 的默认域名，`pool` 给连接池；
# - `tokio1` + `tokio1-rustls-tls` 给异步传输（`AsyncSmtpTransport`）——同步
#   `SmtpTransport::send` 会堵住 tokio 工作线程；
# - `smtp-transport` 不是可选项：SMTP 模块的依赖都挂在它下面。
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport", "builder", "pool", "hostname", "tokio1", "tokio1-rustls-tls",
] }

[dev-dependencies]
# 集成测试直连 MySQL 建库/清表/断言用（src 已不再依赖 sqlx —— 迁移后连裸 SQL
# 都走框架的 Db::query/execute）。
# `chrono` 特性是必须的：迁移前它是被旧 bee_orm（基于 sqlx）传递带进来的，
# 换成 mysql_async 之后这层特性合并就没了，测试里读 DATETIME 列会报
# `NaiveDateTime: sqlx::Type/Decode` 未实现。
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "tls-none", "chrono"] }
# 只被测试用：解内嵌的 PNG 夹具（src 里最后用 base64 的地方是已删掉的 base64 头像路径）
base64 = "0.22"
# tests/ 用的 hashids-rust / reqwest 走上面 [dependencies] 那两条（集成测试能直接用
# 普通依赖，和 aetherupload/serde_json 一样），不在这里再声明一份，免得两个来源打架。
