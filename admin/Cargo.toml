[package]
name = "bee_admin"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
bee_rust = { version = "1.1.5", path = "../crates/bee_rust" }
# 派生宏生成的代码引用 bee_orm::… 路径，必须直接依赖
bee_orm = { version = "1.1.5", path = "../crates/bee_orm" }
axum = { version = "0.8" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
# 登录记录清空需要按条件批量删（ORM 无此能力），直接在 src/ 里用 sqlx
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "tls-none"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
argon2 = { version = "0.5", features = ["std"] }
# password-hash 依赖的 rand_core 默认不带 getrandom，而 OsRng 在 #[cfg(feature = "getrandom")] 后面；
# 必须显式打开（cargo 的 feature 合并会作用到 argon2 内部那份 rand_core）
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
tracing = "0.1"
# 登录限流用它的 throttle 模块；bee_rust 不转发这个依赖（只转发了 bee_* 系列）
security-rust = { workspace = true }
# 头像上传：解 data URL 里的 base64
base64 = "0.22"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
