[package]
name = "bee_admin"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
# 不用默认的 "full"：它会打开 bee_router 的 security（拉 security-rust 1.x），
# 而本项目用的是 3.x 的 throttle，两者会同时进依赖图。
#
# 注意 `router` 只启用 **依赖** `bee_logs`/`bee_config`，而 `bee_rust::bee_logs`
# 这类 re-export 由**同名特性** `logs`/`config` 门控 —— 两组都得列。
bee_rust = { version = "1.2.3", path = "../crates/bee_rust", default-features = false, features = ["router", "orm", "logs", "config"] }
# 派生宏生成的代码引用 bee_orm::… 路径，必须直接依赖。
# mysql：本项目只连 MySQL（上游按后端分特性，默认一个都没开）；
# chrono：模型里大量 chrono::NaiveDateTime 字段，不开这个特性读取路径编不过。
bee_orm = { version = "1.2.3", path = "../crates/bee_orm", features = ["mysql", "chrono"] }
axum = { version = "0.8" }
tokio = { version = "1", features = ["full"] }
# CSV 流式导出：Body::from_stream 要一个 Stream，而 tokio 1.5x 的 mpsc::Receiver
# 不再自带 Stream 实现（tokio 的 stream 特性已移除），用 tokio-stream 的适配器
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
argon2 = { version = "0.5", features = ["std"] }
# password-hash 依赖的 rand_core 默认不带 getrandom，而 OsRng 在 #[cfg(feature = "getrandom")] 后面；
# 必须显式打开（cargo 的 feature 合并会作用到 argon2 内部那份 rand_core）
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
tracing = "0.1"
# 登录限流用它的 throttle 模块。**不走 workspace = true**：workspace 表里那条
# `security-rust = "1"` 是给 bee_router 的可选 security 特性的，1.x 没有 throttle。
security-rust = "3"
# 头像上传：解 data URL 里的 base64
base64 = "0.22"
# 主键（雪花）+ 对外 id（hashids）。两个包在 crates.io 上都有对应版本，
# **按版本依赖，不要用 path**：本地 path 会让 CI 与其他机器直接构建失败。
# lib 名与包名不同：snowflake-id-rust → `snowflake`，hashids-rust → `hashids`。
# hashids 开 `axum` 特性（项目本来就是 axum，无额外编译）；不用 `bee` ——
# 那个特性会从 crates.io 拉一份 bee_router，与 workspace 的 path 版重复。
snowflake-id-rust = "1.1.1"
hashids-rust = { version = "1.0.10", features = ["axum"] }

[dev-dependencies]
# 集成测试直连 MySQL 建库/清表/断言用（src 已不再依赖 sqlx —— 迁移后连裸 SQL
# 都走框架的 Db::query/execute）。
# `chrono` 特性是必须的：迁移前它是被旧 bee_orm（基于 sqlx）传递带进来的，
# 换成 mysql_async 之后这层特性合并就没了，测试里读 DATETIME 列会报
# `NaiveDateTime: sqlx::Type/Decode` 未实现。
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "tls-none", "chrono"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# tests/ 用的 hashids-rust 走上面 [dependencies] 那条（集成测试能直接用普通依赖，
# 和 base64/serde_json 一样），不在这里再声明一份，免得两个来源打架。
