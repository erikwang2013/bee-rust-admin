[package]
name = "bee_router"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
readme.workspace = true
repository.workspace = true

[dependencies]
axum = { workspace = true }
tower = { workspace = true, features = ["timeout"] }
tokio = { workspace = true, features = ["sync", "macros"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true
tracing = { workspace = true }
http = "1"
bee_config = { version = "1.1.5", path = "../bee_config" }
bee_logs = { version = "1.1.5", path = "../bee_logs" }
bee_template = { version = "1.1.5", path = "../bee_template" }
bee_session = { version = "1.1.5", path = "../bee_session" }
bee_cache = { version = "1.1.5", path = "../bee_cache" }
security-rust = { workspace = true, optional = true }

[features]
security = ["security-rust"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "net"] }
