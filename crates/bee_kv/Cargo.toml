[package]
name = "bee_kv"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[dependencies]
async-trait = { workspace = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt"] }

[features]
redis = ["dep:redis", "dep:deadpool-redis"]
# `tokio-rustls-comp` is the Tokio TLS adapter; bare `tls-rustls` has neither
# an async runtime nor a connector.
redis-tls = ["redis", "redis/tokio-rustls-comp"]
# `deadpool-redis` 0.23 no longer needs `serde` to compile its sentinel
# module; the passthrough is retained only because the workspace lockfile
# was resolved with it. Drop it together with the next `Cargo.lock` refresh.
redis-sentinel = ["redis", "deadpool-redis/sentinel", "deadpool-redis/serde"]
redis-cluster = ["redis", "deadpool-redis/cluster"]
memcached = ["dep:memcache"]

[dependencies.redis]
version = "1.6"
optional = true
features = ["tokio-comp", "aio"]

[dependencies.deadpool-redis]
version = "0.23"
optional = true

[dependencies.memcache]
version = "0.17"
optional = true
# The default `tls` feature pulls `openssl`; the crate compiles without it
# (TLS to memcached is unsupported here). Flipping this back re-enables it.
default-features = false

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }

# Build the docs with every feature: the optional backends gate public modules.
[package.metadata.docs.rs]
all-features = true
