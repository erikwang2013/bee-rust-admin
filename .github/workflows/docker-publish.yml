# 打 tag（v*）时构建并推送两个镜像到 GitHub Container Registry：
#   ghcr.io/<owner>/bee-rust-admin       —— 后端（Rust 二进制）
#   ghcr.io/<owner>/bee-rust-admin-web   —— 前端（静态资源 + nginx）
# 也可在 Actions 页面手动触发（workflow_dispatch）。
#
# 拉取示例：
#   docker pull ghcr.io/erikwang2013/bee-rust-admin:1.0.1
#   docker pull ghcr.io/erikwang2013/bee-rust-admin-web:1.0.1
name: docker-publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bee-rust-admin
            context: .
            file: ./Dockerfile
          - image: bee-rust-admin-web
            context: admin/web
            file: admin/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch,enable=${{ github.ref_type == 'branch' }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
